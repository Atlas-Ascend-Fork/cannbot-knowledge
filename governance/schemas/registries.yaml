domains:
  common:
    description: 跨领域公共知识
    direct_types: [glossaries]
  ops:
    description: 算子语义、设计、实现、调试与优化
    direct_types: []
    precreate_routes: true
  graph:
    description: 图编译和图优化
    direct_types: []
  model:
    description: 模型推理、训练、空间智能与具身智能
    direct_types: []
    precreate_routes: true
  runtime:
    description: CANN Runtime、API 与故障诊断
    direct_types: [concepts, apis, runbooks]

technologies:
  ascendc:
    type: language
    description: Ascend C 算子编程语言与 API
    domains: [ops]
  triton:
    type: dsl
    description: Triton 算子编程 DSL
    domains: [ops]
  tilelang:
    type: dsl
    description: TileLang 算子编程 DSL
    domains: [ops]
  pypto:
    type: dsl
    description: PyPTO 算子编程 DSL
    domains: [ops]
  torch_compile:
    type: framework
    description: PyTorch torch.compile 图编译技术栈
    domains: [graph]
  ge:
    type: engine
    description: Graph Engine 图执行与优化技术栈
    domains: [graph]

scopes:
  shared:
    description: 同一领域内不依赖具体技术栈的知识
    domains: [ops, graph]
  platforms:
    description: 产品、芯片、NPU 架构和兼容关系
    domains: [common]
  toolchains:
    description: CANN 环境、构建和工具链
    domains: [common]
  observability:
    description: Profiling、日志和指标
    domains: [common]
  inference:
    description: 模型推理知识
    domains: [model]
  training:
    description: 模型训练知识
    domains: [model]
  spatial:
    description: 空间智能模型与算法知识
    domains: [model]
  embodied:
    description: 具身智能模型与系统知识
    domains: [model]

local_sources:
  cann_docs_raw:
    description: 按固定归档校验和恢复的 Ascend C 官方文档
    root: cann-docs-raw
    fetch_script: fetch-cann-docs.sh
    archive_sha256: 9bc4341ac90740121a20b0ab9d30c6020784bd5969a119e77ab9402a4e6b68c4

paths:
  operator_call_modes: [aclnn, direct]
  operator_categories:
    cv: [image, objdetect]
    math: [conversion, math, random]
    nn: [activation, conv, foreach, index, loss, matmul, norm, optim, pooling, quant, rnn, vfusion]
    transformer: [attention, ffn, gmm, mc2, mhc, moe, posembedding]
  runbook_areas: [compilation, runtime, precision, performance, validations]

platforms:
  a2:
    description: Atlas A2 系列
  a3:
    description: Atlas A3 系列
  "950":
    description: Ascend 950 系列（包含旧称 Atlas A5）
  "310p":
    description: Ascend 310P 系列
  "910":
    description: 早期 Ascend 910 系列
  agnostic:
    description: 结论按定义与硬件平台无关，不会随平台注册表扩张而改变含义

