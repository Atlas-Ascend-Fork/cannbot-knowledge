services:
  cannbot-mcp:
    image: cannbot-knowledge-mcp:local
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: cannbot-mcp
    init: true
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file: tokens.env
    volumes:
      - ${KNOWLEDGE_ROOT:-../..}:/data/repo:ro
      - cannbot-mcp-index:/data/repo/artifacts
      - cannbot-mcp-logs:/data/logs

volumes:
  cannbot-mcp-index:
    name: cannbot-mcp-index
  cannbot-mcp-logs:
    name: cannbot-mcp-logs
