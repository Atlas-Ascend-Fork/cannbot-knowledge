    body: |
      # SyntheticWarpCopy exact contract

      This fixture belongs only to the A3 platform.
  - path: knowledge/ops/ascendc/apis/synthetic_warp_copy_draft.md
    metadata:
      type: API
      title: SyntheticWarpCopy exact contract
      description: Draft candidate that must not leak into stable results.
      tags: [task.lookup, topic.data_movement]
      status: draft
      sources: []
      created_at: "2026-08-18T00:00:00Z"
      updated_at: "2026-08-18T00:00:00Z"
      platforms: [a2]
    body: |
      # SyntheticWarpCopy exact contract

      This fixture verifies the default stable lifecycle boundary.
  - path: knowledge/ops/shared/concepts/shared_alignment_boundary.md
    metadata:
      type: Concept
      title: SharedAlignmentBoundary contract
      description: Shared fixture returned only when shared expansion is explicit.
      tags: [task.lookup, topic.alignment]
