# 32 条轨迹查询 + 40 个人工场景，固定 top5；source 保留轨迹定位信息。
# expected 中每张卡都必须命中；expected_any 中每组至少命中一张，组间仍为 AND。
# 期望为人工标注，未做独立复核；返回其他未标注候选不自动判负。
# 这里只测试检索，不把参数错误、候选命中或缺口场景当作问答成功。

