quality:
  min_recall_at_k: 1.0
  min_mrr: 1.0
  max_p95_ms: 1000

synthetic_cards:
  - path: knowledge/ops/ascendc/apis/synthetic_warp_copy.md
    metadata:
      type: API
      title: SyntheticWarpCopy exact contract
      description: Exact target for deterministic ranking and platform filtering.
      tags: [task.lookup, topic.data_movement]
      status: stable
      sources:
        - resource: https://example.com/reference/synthetic-warp-copy
          role: primary
      created_at: "2026-08-18T00:00:00Z"
      updated_at: "2026-08-18T00:00:00Z"
      platforms: [a2]
    body: |
      # SyntheticWarpCopy exact contract

      This synthetic card is the exact API contract expected at rank one.
  - path: knowledge/ops/ascendc/concepts/synthetic_copy_overview.md
    metadata:
      type: Concept
      title: Synthetic copy contract overview
      description: A weaker same-platform candidate used to exercise ranking.
      tags: [task.lookup, topic.data_movement]
      status: stable
      sources:
        - resource: https://example.com/reference/synthetic-copy-overview
          role: primary
      created_at: "2026-08-18T00:00:00Z"
      updated_at: "2026-08-18T00:00:00Z"
      platforms: [a2]
    body: |
      # Synthetic copy contract overview

      SyntheticWarpCopy is mentioned as one generic data-movement example.
  - path: knowledge/ops/triton/apis/synthetic_warp_copy.md
    metadata:
      type: API
      title: SyntheticWarpCopy exact contract
      description: Cross-DSL candidate that must not leak into Ascend C results.
      tags: [task.lookup, topic.data_movement]
      status: stable
      sources:
        - resource: https://example.com/reference/triton-synthetic-warp-copy
          role: primary
      created_at: "2026-08-18T00:00:00Z"
      updated_at: "2026-08-18T00:00:00Z"
      platforms: [a2]
    body: |
      # SyntheticWarpCopy exact contract

      This fixture belongs only to the Triton route.
  - path: knowledge/ops/ascendc/apis/synthetic_warp_copy_a3.md
    metadata:
      type: API
      title: SyntheticWarpCopy exact contract
      description: Wrong-platform candidate that must not leak into A2 results.
      tags: [task.lookup, topic.data_movement]
      status: stable
      sources:
        - resource: https://example.com/reference/a3-synthetic-warp-copy
          role: primary
      created_at: "2026-08-18T00:00:00Z"
      updated_at: "2026-08-18T00:00:00Z"
