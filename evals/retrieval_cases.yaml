cases:
  - id: synthetic_rank_and_scope
    corpus: synthetic
    query: SyntheticWarpCopy exact contract
    filters:
      technology: ascendc
      platform: a2
      status: stable
    expected:
      - ops/ascendc/apis/synthetic_warp_copy
    excluded:
      - ops/triton/apis/synthetic_warp_copy
      - ops/ascendc/apis/synthetic_warp_copy_a3
      - ops/ascendc/apis/synthetic_warp_copy_draft
    expected_count: 2
    expected_fields: [rank, card_sha256, card_lines, trust_tier, local_path]
  - id: synthetic_cross_dsl_target
    corpus: synthetic
    query: SyntheticWarpCopy exact contract
    filters:
      technology: triton
      platform: a2
      status: stable
    expected:
      - ops/triton/apis/synthetic_warp_copy
    excluded:
      - ops/ascendc/apis/synthetic_warp_copy
    expected_count: 1
  - id: synthetic_explicit_shared
    corpus: synthetic
    query: SharedAlignmentBoundary
    filters:
      technology: ascendc
      platform: a2
      include_shared: true
      status: stable
    expected:
      - ops/shared/concepts/shared_alignment_boundary
    expected_count: 1
  - id: empty_ascendc_search
    query: qzxk_vwbr_hjdm_plqn
    filters:
      technology: ascendc
      platform: a2
      status: stable
    expected_count: 0
  - id: repository_ascendc_assert
    query: assert AI CPU 断言
    filters:
      technology: ascendc
      type: apis
      platform: a2
      status: stable
      k: 3
    expected:
      - ops/ascendc/apis/ai_cpu_api/assert
  - id: repository_tiling_key_exact_title
    query: GET_TPL_TILING_KEY
    filters:
      technology: ascendc
      type: apis
      status: draft
      include_unlocated: true
      match: literal
      k: 3
    expected:
      - ops/ascendc/apis/utils_api/tiling_template_programming/get_tpl_tiling_key
  - id: exclude_unsupported_expf_from_a2
    query: expf
    filters:
      technology: ascendc
      type: apis
      platform: a2
      status: stable
      match: literal
      k: 10
    excluded:
      - ops/ascendc/apis/simt_api/math_functions/float_math_functions/expf
  - id: repository_rtc_create_program_exact_title
    query: aclrtcCreateProg
    filters:
      technology: ascendc
      type: apis
      platform: a2
      status: stable
      match: literal
      k: 3
    expected:
      - ops/ascendc/apis/utils_api/rtc/aclrtc_create_prog
  - id: repository_mc2_tuning_guide
    query: MC²算子性能调优案例
    filters:
      technology: ascendc
      type: guides
      status: draft
      include_unlocated: true
      match: literal
      k: 3
    expected:
      - ops/ascendc/guides/operator_practice/best_practices/mc_operator_tuning
  - id: repository_gelu_950_operator
    query: Gelu 950 Direct Invoke 算子知识
    filters:
      technology: ascendc
      type: operators
      platform: "950"
      status: stable
      match: literal
      k: 3
    expected:
      - ops/ascendc/operators/direct/nn/activation/gelu_950
  - id: repository_qwen3_next_general_concept_on_310p
    query: Qwen3-Next
    filters:
      technology: inference
      type: concepts
      platform: 310p
      status: stable
      match: literal
      k: 3
    expected:
      - model/inference/concepts/models/qwen3_next
  - id: repository_qwen3_next_a3_deployment_guide
    query: Qwen3-Next Atlas A3 推理部署与优化指南
    filters:
      technology: inference
      type: guides
      platform: a3
      status: stable
      match: literal
      k: 3
    expected:
      - model/inference/guides/models/qwen3_next_atlas_a3_deployment
  - id: exclude_qwen3_next_a3_deployment_from_310p
    query: Qwen3-Next Atlas A3 推理部署与优化指南
    filters:
      technology: inference
      type: guides
      platform: 310p
      status: stable
      match: literal
    expected_count: 0
  - id: repository_hif8_training_on_950
    query: HiF8（HiFloat8）8-bit 浮点格式与 V3 低精度预训练量化方案
    filters:
      technology: training
      type: concepts
      platform: "950"
      status: stable
      match: literal
      k: 3
    expected:
      - model/training/concepts/quantization/hif8
  - id: repository_action_chunking_on_310p
    query: Action Chunking（动作分块 / ACT Transformer）
    filters:
      technology: embodied
      type: concepts
      platform: 310p
      status: stable
      match: literal
      k: 3
    expected:
      - model/embodied/concepts/modules/action_chunking
  - id: empty_triton_concepts_search
    query: programming model
    filters:
      technology: triton
      type: concepts
      platform: a2
      status: stable
    expected_count: 0
  - id: triton_memory_api_search
    query: 内存操作 API（tl.load / tl.store / block_ptr）
    filters:
      domain: ops
      technology: triton
      type: apis
      platform: a2
      status: stable
      match: literal
      k: 3
    expected:
      - ops/triton/apis/tl_memory_ops
  - id: triton_memory_api_excludes_unsupported_platform
    query: 内存操作 API（tl.load / tl.store / block_ptr）
    filters:
      domain: ops
      technology: triton
      type: apis
      platform: "950"
      status: stable
      match: literal
    expected_count: 0
  - id: common_platform_hardware_search
    query: Ascend 910B2/910B3 硬件规格
    filters:
      domain: common
      technology: platforms
      type: concepts
      platform: a2
      status: stable
      match: literal
      k: 3
    expected:
      - common/platforms/concepts/ascend_910b
  - id: common_platform_unmatched_terms_search
    query: thermal throttling policy
    filters:
      domain: common
      technology: platforms
      type: concepts
      platform: a2
      status: stable
    expected_count: 0
  - id: reject_unknown_domain
    query: target API
    filters:
      domain: unknown
    expected_error: "unknown domain: unknown"
  - id: reject_unknown_technology
    query: target API
    filters:
      technology: unknown
    expected_error: "unknown technology or scope: unknown"
  - id: reject_unknown_platform
    query: target API
    filters:
      platform: unknown
    expected_error: "unknown platforms: unknown"
  - id: reject_retired_a5_platform_id
    query: target API
    filters:
      platform: a5
    expected_error: "unknown platforms: a5"
  - id: reject_unknown_tag
    query: target API
    filters:
      tag: topic.unknown
    expected_error: "unknown tags: topic.unknown"
  - id: reject_unknown_source_technology
    query: technology mapping
    filters:
      source_technology: unknown
    expected_error: "unknown source technology: unknown"
  - id: reject_missing_platform
    query: target API
    filters:
      technology: ascendc
    expected_error: "platform is required"
  - id: reject_unlocated_stable
    query: technology mapping
    filters:
      technology: shared
      include_unlocated: true
      status: stable
    expected_error: "--include-unlocated requires --status draft or all"
  - id: reject_shared_without_concrete_technology
    query: shared behavior
    filters:
      domain: ops
      platform: a2
      include_shared: true
    expected_error: "--include-shared requires a concrete technology"
