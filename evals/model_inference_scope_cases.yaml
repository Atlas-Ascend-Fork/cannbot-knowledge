# RFC47 模型推理评测：model_scope_01～30 为唯一主集，其后是独立机器契约回归。
# 主集保留 30 道召回正例；不改变原 70 条语料或质量阈值。
# 整文件运行的聚合分数覆盖机器回归；RFC 主集指标须按上述 30 题单列。
# expected_scope_states/excluded 只断言机器行为，不是人工适用性标签或 A/B 质量结论。
cases:
# 主集：原编号与问题保持；期望路径沿用已冻结的迁移映射，不代表人工或设备验收。
- id: model_scope_01
  query: attention 走 DP 时对 o_proj / dense-MLP 单独 TP：DP→TP→DP 边界通信省单卡内存与权重搬运
  filters:
    domain: model
    technology: inference
    platform: a3
    status: stable
    match: text
    k: 5
  scope:
    schema: model.inference.v1
    any_of:
    - all_of:
        objective:
        - latency
  expected:
  - model/inference/optimizations/rules/local_tp_memory_heavy_projections
  excluded: []
- id: model_scope_02
  query: Attention-FFN 解耦（AFD）部署：把 MoE/FFN 剥到独立 rank，Send/Recv over SDMA 解除同卡多流控核约束降 decode TPOT
