name: "Requirement|治理与能力建议"
description: "提出知识治理、检索、Skill、安装、评测、CI 或协作流程方面的新需求。"
title: "[Requirement|需求建议]: "
body:
  - type: markdown
    attributes:
      value: |
        请先说明问题和使用场景，再描述建议方案。单纯申请补充某项技术知识时，请使用“Knowledge-Request|知识需求”。

  - type: dropdown
    id: scope
    attributes:
      label: Scope / 建议范围
      options:
        - Schema / Profile / Registry / Contract / Spec
        - knowledge-query / knowledge-ingest / knowledge-lint
        - 检索、索引或图谱
        - 安装、发布或跨仓同步
        - 评测、测试或 CI
        - 文档或协作流程
        - 其他
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Background / 背景与问题
      description: 请描述当前限制、真实使用场景和受影响用户。
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome / 期望结果
      description: 请说明期望新增或改变的行为，以及可用于验收的结果。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议方案
      description: 可描述规则、接口、流程、数据结构或伪代码；尚无方案时可留空。
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact / 影响与兼容性
      description: 请评估对现有知识、Schema、检索、图谱、安装方式、Skill 发布镜像或用户流程的影响。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 备选方案
      description: 请说明考虑过的替代做法、不实施的影响，以及仍需讨论的问题。
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklists / 提交确认
      options:
        - label: 我已搜索现有 Issue、治理规范和 Skill 文档，确认该建议尚未覆盖。
          required: true
        - label: 我已说明需求价值、影响范围和兼容性风险。
          required: true
