name: "Knowledge-Request|知识需求"
description: "申请补充当前知识库尚未覆盖的 CANN、DSL、API、算子、调试或优化知识。"
title: "[Knowledge-Request|知识需求]: "
body:
  - type: markdown
    attributes:
      value: |
        请描述真实使用场景和当前知识缺口。知识入库需要可追溯来源，并会先检查是否已有同主题知识。

  - type: textarea
    id: scenario
    attributes:
      label: Scenario / 使用场景
      description: 请说明要完成的工程任务、遇到的问题，以及为什么需要这项知识。
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domain / 所属领域
      description: 不确定时请选择“尚不确定”。
      options:
        - common / 通用知识
        - ops / 算子开发
        - graph / 图开发
        - model / 模型
        - runtime / 运行时
        - 尚不确定
    validations:
      required: true

  - type: input
    id: technology
    attributes:
      label: Technology or scope / 技术或作用域
      description: 例如 Ascend C、Triton、TileLang、PyPTO、模型推理或训练；不确定可留空。
      placeholder: Ascend C
    validations:
      required: false

  - type: textarea
    id: query-attempt
    attributes:
      label: Query attempt / 已尝试的检索
      description: 请填写检索词、筛选条件和结果，说明现有知识为什么不能满足需求。
    validations:
      required: true

  - type: textarea
    id: expected-knowledge
    attributes:
      label: Expected knowledge / 期望补充的知识
      description: 请说明希望知识卡回答哪些问题，以及什么结果可以视为需求已满足。
    validations:
      required: true

  - type: textarea
    id: candidate-sources
    attributes:
      label: Candidate sources / 候选来源
      description: 可提供官方文档、固定版本源码、测试或实验线索；没有候选来源时可留空。
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklists / 提交确认
      options:
        - label: 我已搜索现有知识和 Issue，确认当前需求尚未被覆盖。
          required: true
        - label: 我理解没有可靠来源或明确适用范围的内容可能不会进入知识库。
          required: true
